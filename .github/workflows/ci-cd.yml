name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── 1. BACKEND CONTINUOUS INTEGRATION ────────────────────────────
  backend-ci:
    name: Backend CI (Test & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax (Compile Check)
        run: |
          python -m compileall app/

      - name: Run Backend Pytest Suite
        env:
          GEMINI_API_KEY: "ci-dummy-key"
          CHROMA_DB_PATH: "./chroma_db_ci"
          UPLOAD_DIR: "./uploads_ci"
        run: |
          pytest

  # ─── 2. FRONTEND CONTINUOUS INTEGRATION ───────────────────────────
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run ESLint Quality Check
        run: |
          npm run lint

      - name: Build Frontend Distribution
        run: |
          npm run build

  # ─── 3. CONTINUOUS DEPLOYMENT - BACKEND ────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "🚀 Triggering Render deployment hook..."
            curl -f -X POST "$RENDER_HOOK"
            echo "✅ Render deployment triggered successfully."
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret not configured in GitHub Secrets."
            echo "👉 To enable automatic Render deployments, add your Render Deploy Hook URL to GitHub Repo Settings > Secrets and variables > Actions."
          fi

  # ─── 4. CONTINUOUS DEPLOYMENT - FRONTEND ───────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies & Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "🚀 Deploying production build to Vercel..."
            npx --yes vercel deploy --prod --token="$VERCEL_TOKEN"
          else
            echo "ℹ️ VERCEL_TOKEN secret not configured in GitHub Secrets."
            echo "👉 If using Vercel, connect your GitHub repository directly in Vercel or configure VERCEL_TOKEN in Secrets."
          fi
